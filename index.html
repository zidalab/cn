<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>Redirecting...</title>

  <link rel="canonical" href="https://zidalab.github.io/zh/">

  <meta http-equiv="refresh" content="0; url=https://zidalab.github.io/zh/">

  <script>
    const target = 'https://zidalab.github.io/zh/'
      + location.search
      + location.hash;

    location.replace(target);
  </script>
</head>
<body>
  <p>
    页面已迁移到
    <a href="https://zidalab.github.io/zh/">https://zidalab.github.io/zh/</a>
  </p>
</body>
</html>
